name: CI

on:
  push:
  workflow_dispatch:

jobs:
  core-tests:
    name: Core package tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  app-build:
    name: App build (macOS + iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for macOS
        run: |
          set -o pipefail
          xcodebuild -project AMSPara.xcodeproj -scheme AMSPara -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build-macos.log | grep -E "error:|warning:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build-macos.log
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project AMSPara.xcodeproj -scheme AMSPara -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build-ios.log | grep -E "error:|warning:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build-ios.log
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: build-*.log

  commit-project:
    name: Commit generated Xcode project
    runs-on: macos-15
    needs: [core-tests, app-build]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Commit and push when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AMSPara.xcodeproj
          if git diff --cached --quiet; then
            echo "Xcode project is up to date."
            exit 0
          fi
          git commit -m "Regenerate Xcode project from project.yml"
          git push
