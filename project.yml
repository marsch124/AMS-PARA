# XcodeGen spec. Run `xcodegen generate` and open AMSPara.xcodeproj.
# Any change here makes CI regenerate the committed project (needed after adding source files).
name: AMSPara
options:
  bundleIdPrefix: com.schabbauer
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  AMSParaCore:
    # The package lives in its own folder: Xcode cannot reference a local
    # package that sits in the same directory as the .xcodeproj.
    path: Core

targets:
  AMSPara:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: App/AMSPara
      # The built-in manual (Help window / Settings › Help).
      - path: Docs
        buildPhase: resources
    dependencies:
      - package: AMSParaCore
        product: AMSParaCore
      - target: AMSParaShare
        platformFilter: iOS
    info:
      path: App/AMSPara/Info.plist
      properties:
        CFBundleDisplayName: AMS PARA
        CFBundleName: AMS PARA
        # Without this key macOS and iOS ignore the AppIcon set in the asset catalog.
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleURLTypes:
          - CFBundleURLName: com.schabbauer.amspara
            CFBundleURLSchemes: [amspara]
        NSCalendarsFullAccessUsageDescription: AMS PARA shows calendar events for the day next to your tasks in Today and in daily notes.
        NSCalendarsUsageDescription: AMS PARA shows calendar events for the day next to your tasks in Today and in daily notes.
        NSRemindersFullAccessUsageDescription: AMS PARA mirrors the tasks in your PARA notes to Apple Reminders and back.
        NSRemindersUsageDescription: AMS PARA mirrors the tasks in your PARA notes to Apple Reminders and back.
        NSHumanReadableCopyright: ""
        UILaunchScreen: {}
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
    entitlements:
      path: App/AMSPara/AMSPara.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.application-groups: [group.com.schabbauer.amspara]
    settings:
      base:
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: true
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  AMSParaShare:
    type: app-extension
    platform: iOS
    sources:
      - path: App/AMSParaShare
    dependencies:
      - package: AMSParaCore
        product: AMSParaCore
    info:
      path: App/AMSParaShare/Info.plist
      properties:
        CFBundleDisplayName: AMS PARA
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
    entitlements:
      path: App/AMSParaShare/AMSParaShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.schabbauer.amspara]
    settings:
      base:
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSPara.Share
        SKIP_INSTALL: true

schemes:
  AMSPara:
    build:
      targets:
        AMSPara: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
