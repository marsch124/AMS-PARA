# XcodeGen spec. Run `xcodegen generate` and open AMSPara.xcodeproj.
# Any change here makes CI regenerate the committed project (needed after adding source files).
name: AMSPara
options:
  bundleIdPrefix: com.schabbauer
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  AMSParaCore:
    # The package lives in its own folder: Xcode cannot reference a local
    # package that sits in the same directory as the .xcodeproj.
    path: Core

targets:
  AMSPara:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      # Synchronized folder (Xcode 16+): new source files are picked up without
      # regenerating the project, so the committed project rarely changes.
      - path: App/AMSPara
        type: syncedFolder
      # The built-in manual (Help window on the Mac, Settings › Help on iOS).
      - path: Docs
        buildPhase: resources
    dependencies:
      - package: AMSParaCore
        product: AMSParaCore
      - target: AMSParaShare
        platformFilter: iOS
    info:
      path: App/Config/AMSPara/Info.plist
      properties:
        CFBundleDisplayName: PARAGON
        CFBundleName: PARAGON
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.schabbauer.amspara.task
            UTTypeDescription: PARAGON task
            UTTypeConformsTo: [public.data]
        # Without this key macOS and iOS ignore the AppIcon set in the asset catalog.
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleURLTypes:
          - CFBundleURLName: com.schabbauer.amspara
            CFBundleURLSchemes: [amspara]
        NSCalendarsFullAccessUsageDescription: PARAGON shows calendar events for the day next to your tasks in Today and in daily notes.
        NSCalendarsUsageDescription: PARAGON shows calendar events for the day next to your tasks in Today and in daily notes.
        NSRemindersFullAccessUsageDescription: PARAGON mirrors the tasks in your PARA notes to Apple Reminders and back.
        NSRemindersUsageDescription: PARAGON mirrors the tasks in your PARA notes to Apple Reminders and back.
        NSHumanReadableCopyright: ""
        UILaunchScreen: {}
        # Apple rejects an upload without these: iPad multitasking needs all four.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
    entitlements:
      path: App/Config/AMSPara/AMSPara.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.application-groups: [group.com.schabbauer.amspara]
    settings:
      base:
        # The built app is PARAGON.app, not AMSPara.app: on the Mac, Finder and the Dock
        # show the bundle's file name, so CFBundleDisplayName alone would leave the old
        # name on screen. The target, the folder and the bundle id are untouched.
        PRODUCT_NAME: PARAGON
        # Pinned, not derived from the target name: this is the app's identity to Apple and
        # changing it would make PARAGON a different app — new TestFlight, fresh install.
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSPara
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: D24ENP83QQ
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/Config/AMSPara/AMSPara-macOS.entitlements
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: true
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  AMSParaShare:
    type: app-extension
    platform: iOS
    sources:
      - path: App/AMSParaShare
        type: syncedFolder
    dependencies:
      - package: AMSParaCore
        product: AMSParaCore
    info:
      path: App/Config/AMSParaShare/Info.plist
      properties:
        CFBundleDisplayName: PARAGON
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
    entitlements:
      path: App/Config/AMSParaShare/AMSParaShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.schabbauer.amspara]
    settings:
      base:
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: D24ENP83QQ
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSPara.Share
        SKIP_INSTALL: true

schemes:
  AMSPara:
    build:
      targets:
        AMSPara: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
